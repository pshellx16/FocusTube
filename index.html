<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="color-scheme" content="dark" />
  <title>FocusTube — Distraction-Free Player</title>
  <meta name="description" content="Distraction-free YouTube video and playlist player for students and developers." />
  <meta property="og:title" content="FocusTube — Distraction-Free Player" />
  <meta property="og:description" content="Distraction-free YouTube video and playlist player for students and developers." />
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface-hover: #262626;
      --border: #2e2e2e;
      --text: #f1f1f1;
      --muted: #9aa0a6;
      --accent: #e62117;
      --accent-hover: #c51910;

      --content-max: 1200px;
      --content-max-wide: 1500px;
      --player-radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overflow-x: clip;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: clip;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding:
        max(20px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        calc(20px + env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    header,
    .idle-subtitle,
    .controls-bar,
    .status-msg,
    .player-wrapper,
    .below-player-bar,
    .playlist-panel,
    .privacy-footer {
      width: 100%;
      max-width: var(--content-max);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    h1 span {
      color: var(--accent);
    }

    .idle-subtitle {
      display: none;
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 18px;
    }

    .controls-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    /* ---------------- IDLE STATE (Before any link is loaded) ---------------- */
    body:not(.has-media) .player-wrapper,
    body:not(.has-media) .below-player-bar,
    body:not(.has-media) .playlist-panel {
      display: none !important;
    }

    body:not(.has-media) header,
    body:not(.has-media) .idle-subtitle,
    body:not(.has-media) .controls-bar,
    body:not(.has-media) .status-msg {
      max-width: 720px;
    }

    body:not(.has-media) header {
      position: relative;
      justify-content: center;
      margin-top: auto;
      margin-bottom: 8px;
    }

    body:not(.has-media) header #clearBtn {
      position: absolute;
      right: 0;
    }

    body:not(.has-media) h1 {
      font-size: 1.75rem;
    }

    body:not(.has-media) .idle-subtitle {
      display: block;
    }

    body:not(.has-media) .status-msg {
      text-align: center;
      margin-bottom: auto;
    }

    body:not(.has-media) .privacy-footer {
      margin-top: 24px;
    }

    /* >= 16px prevents iOS Safari auto-zoom on input focus */
    input[type="text"],
    input[type="number"] {
      padding: 10px 14px;
      font-size: 16px;
      font-family: inherit;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      outline: none;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
    }

    input:focus {
      border-color: #666;
    }

    button {
      padding: 9px 14px;
      font-size: 13.5px;
      font-weight: 500;
      font-family: inherit;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #8ab4f8;
      outline-offset: 2px;
    }

    @media (hover: hover) {
      button:hover:not(:disabled) {
        background: var(--surface-hover);
      }

      button.primary:hover:not(:disabled) {
        background: var(--accent-hover);
      }
    }

    button:active:not(:disabled) {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.active-toggle {
      background: #2c2c2c;
      border-color: #666;
      color: #fff;
    }

    .status-msg {
      font-size: 13px;
      color: #ff8a80;
      margin-bottom: 8px;
      min-height: 18px;
    }

    .status-msg.info {
      color: #8ab4f8;
    }

    body.has-media:not(.focus-mode) {
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
    }

    body.has-media header {
      margin-bottom: 8px;
    }

    body.has-media .controls-bar {
      margin-bottom: 8px;
    }

    body.has-media .status-msg:empty {
      display: none;
    }

    body.has-media .below-player-bar {
      margin-top: 8px;
      padding: 8px 12px;
    }

    body.has-media .playlist-panel {
      margin-top: 8px;
      padding: 8px 12px;
    }

    body.has-media .privacy-footer {
      padding-top: 10px;
    }

    /* Player Container (min 200x200 enforced for YouTube policy compliance) */
    .player-wrapper {
      aspect-ratio: 16 / 9;
      min-width: 200px;
      min-height: 200px;
      background: #000;
      border-radius: var(--player-radius);
      overflow: hidden;
      border: 1px solid var(--border);
      transition: max-width 0.2s ease, width 0.2s ease;
    }

    /* Fit full player + control panel on desktop/laptop screens without scrolling */
    @media (min-width: 641px) {
      body.has-media:not(.focus-mode):not(.theater-mode) {
        --chrome-reserve: 215px;
      }

      body.has-media.has-playlist:not(.focus-mode):not(.theater-mode) {
        --chrome-reserve: 275px;
      }

      body.has-media:not(.focus-mode):not(.theater-mode) .player-wrapper {
        width: min(100%, var(--content-max), max(356px, calc((100dvh - var(--chrome-reserve)) * 16 / 9)));
      }
    }

    .player-wrapper:fullscreen,
    .player-wrapper:-webkit-full-screen {
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      border: none;
      border-radius: 0;
    }

    #ytPlayerMount,
    .player-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Info + Mode buttons directly below player */
    .below-player-bar {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: max-width 0.2s ease;
    }

    .now-playing-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1 1 240px;
    }

    .count-badge {
      background: #2a2a2a;
      border: 1px solid #3d3d3d;
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 5px;
      flex-shrink: 0;
    }

    .video-title-text {
      font-size: 13.5px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }

    .view-mode-buttons {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Playlist Navigator Panel */
    .playlist-panel {
      margin-top: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      display: none;
      transition: max-width 0.2s ease;
    }

    .playlist-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .playlist-nav-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .playlist-label {
      font-size: 13px;
      color: var(--muted);
    }

    .jump-input {
      width: 84px;
      padding: 8px 10px !important;
      font-size: 16px !important;
      text-align: center;
    }

    .playlist-meta-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .playlist-total-hint {
      font-size: 12.5px;
      color: var(--muted);
    }

    .playlist-tray {
      position: relative;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      max-height: 360px;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: #3a3a3a transparent;
    }

    .playlist-tray[hidden] {
      display: none;
    }

    .playlist-item {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      text-align: left;
      padding: 0;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: #141414;
      overflow: hidden;
      white-space: normal;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    @media (hover: hover) {
      .playlist-item:hover:not(:disabled) {
        background: #1f1f1f;
        border-color: #4a4a4a;
      }
    }

    .playlist-item.is-active {
      border-color: var(--accent);
      background: #211515;
    }

    .playlist-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0b0b0b;
      overflow: hidden;
    }

    .playlist-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .playlist-num-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.2;
    }

    .playlist-item.is-active .playlist-num-badge {
      background: var(--accent);
    }

    .playlist-dur-badge {
      position: absolute;
      right: 6px;
      bottom: 6px;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.82);
      color: #f1f1f1;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.2;
      display: none;
    }

    .playlist-dur-badge.has-duration {
      display: inline-block;
    }

    .playlist-item-meta {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      padding: 8px 9px;
      min-height: 44px;
    }

    .playlist-item-title {
      font-size: 12.5px;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
      flex: 1;
    }

    .playlist-item-state {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .playlist-item.is-active .playlist-item-state {
      color: #ff6b63;
    }

    .privacy-footer {
      margin-top: auto;
      padding-top: 18px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      opacity: 0.78;
      transition: max-width 0.2s ease;
    }

    /* ---------------- FOCUS MODE (Policy-safe: non-overlapping top bar) ---------------- */
    .focus-top-bar {
      display: none;
      width: 100%;
      flex-shrink: 0;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: calc(6px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 6px calc(12px + env(safe-area-inset-left));
      background: #0a0a0a;
      border-bottom: 1px solid #222;
    }

    .focus-title-text {
      font-size: 13px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      flex: 1;
    }

    .exit-focus-btn {
      padding: 6px 12px;
      font-size: 12.5px;
      background: #1d1d1d;
      border-color: #444;
      color: #fff;
      flex-shrink: 0;
    }

    .exit-focus-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    body.focus-mode {
      padding: 0;
      padding-bottom: env(safe-area-inset-bottom);
      background: #000;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    body.focus-mode .focus-top-bar {
      display: flex;
    }

    body.focus-mode header,
    body.focus-mode .controls-bar,
    body.focus-mode .status-msg,
    body.focus-mode .below-player-bar,
    body.focus-mode .playlist-panel,
    body.focus-mode .privacy-footer {
      display: none !important;
    }

    body.focus-mode .player-wrapper {
      flex: 1 1 0%;
      width: 100%;
      max-width: none;
      min-height: 200px;
      aspect-ratio: auto;
      border: none;
      border-radius: 0;
    }

    /* ---------------- THEATER MODE (Desktop / Wide Screens Only) ---------------- */
    @media (max-width: 899px) {
      #theaterBtn {
        display: none;
      }
    }

    @media (min-width: 900px) {
      body.theater-mode:not(.focus-mode) .player-wrapper {
        flex: 1 1 0%;
        width: 100%;
        max-width: var(--content-max-wide);
        min-height: 270px;
        max-height: calc(100dvh - 180px);
        aspect-ratio: auto;
        height: auto;
      }

      body.theater-mode header,
      body.theater-mode .controls-bar,
      body.theater-mode .status-msg,
      body.theater-mode .below-player-bar,
      body.theater-mode .playlist-panel,
      body.theater-mode .privacy-footer {
        max-width: var(--content-max-wide);
      }
    }

    /* ---------------- MOBILE (Phones) ---------------- */
    @media (max-width: 640px) {
      body {
        padding:
          max(12px, env(safe-area-inset-top))
          max(10px, env(safe-area-inset-right))
          calc(12px + env(safe-area-inset-bottom))
          max(10px, env(safe-area-inset-left));
      }

      header {
        margin-bottom: 10px;
      }

      .controls-bar {
        flex-wrap: wrap;
      }

      .controls-bar input[type="text"] {
        width: 100%;
        flex: none;
      }

      .controls-bar button {
        flex: 1;
        min-height: 42px;
        padding: 10px 10px;
        font-size: 14px;
      }

      .below-player-bar {
        flex-direction: column;
        align-items: stretch;
        padding: 10px 12px;
      }

      .now-playing-info {
        flex: none;
        width: 100%;
      }

      .view-mode-buttons {
        justify-content: stretch;
        flex-wrap: wrap;
      }

      .view-mode-buttons button {
        flex: 1 1 auto;
        min-height: 40px;
        padding: 9px 10px;
      }

      .playlist-panel {
        padding: 10px 12px;
      }

      .playlist-nav-group {
        width: 100%;
        flex-wrap: wrap;
        justify-content: center;
      }

      .playlist-nav-group button {
        min-height: 38px;
      }

      .playlist-meta-group {
        width: 100%;
        justify-content: space-between;
      }

      .playlist-tray {
        grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
        max-height: 300px;
        gap: 8px;
      }

      .player-wrapper {
        border-radius: 6px;
      }
    }

    @media (max-width: 420px) {
      .playlist-label {
        display: none;
      }

      .playlist-nav-group {
        gap: 6px;
      }

      .playlist-nav-group button {
        padding: 8px 10px;
        font-size: 13px;
      }

      .jump-input {
        width: 60px;
        padding: 7px 6px !important;
      }

      .playlist-total-hint {
        font-size: 12px;
      }

      .playlist-tray {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .playlist-item-meta {
        padding: 6px 7px;
        min-height: 38px;
      }

      .playlist-item-title {
        font-size: 12px;
      }
    }

    @media (min-width: 1400px) {
      body {
        padding:
          max(28px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          calc(28px + env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
      }

      h1 {
        font-size: 1.4rem;
      }
    }

    /* Short landscape viewports (rotated phone): keeps player >= 200px tall */
    @media (max-height: 520px) and (orientation: landscape) {
      body:not(.focus-mode) {
        padding:
          max(8px, env(safe-area-inset-top))
          max(14px, env(safe-area-inset-right))
          calc(8px + env(safe-area-inset-bottom))
          max(14px, env(safe-area-inset-left));
      }

      body:not(.focus-mode) header {
        margin-bottom: 8px;
      }

      body:not(.focus-mode) .controls-bar {
        margin-bottom: 6px;
      }

      body:not(.focus-mode) .player-wrapper {
        width: min(100%, max(356px, calc((100dvh - 125px) * 16 / 9)));
      }

      body:not(.focus-mode) .playlist-tray {
        max-height: 220px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

  <!-- Non-overlapping Focus Mode Top Bar -->
  <div class="focus-top-bar">
    <span class="focus-title-text" id="focusTitleText">Focus Mode</span>
    <button type="button" class="exit-focus-btn" onclick="setFocusMode(false)">✕ Exit Focus</button>
  </div>

  <header>
    <h1>Focus<span>Tube</span></h1>
    <button type="button" id="clearBtn" onclick="clearPlayer()" title="Reset player" hidden>Clear</button>
  </header>

  <p class="idle-subtitle">Distraction-free YouTube player for focused study and work.</p>

  <div class="controls-bar">
    <input
      type="text"
      id="ytInput"
      placeholder="Paste a YouTube video or playlist link (auto-plays)"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      inputmode="url"
      enterkeyhint="go"
    />
    <button type="button" class="primary" onclick="handlePlay()">Play</button>
    <button type="button" onclick="pasteAndPlay()">Paste &amp; Play</button>
  </div>

  <div class="status-msg" id="statusMsg" role="status" aria-live="polite"></div>

  <!-- Video Player -->
  <div class="player-wrapper" id="playerWrapper">
    <div id="ytPlayerMount"></div>
  </div>

  <!-- Info + Mode Buttons -->
  <div class="below-player-bar">
    <div class="now-playing-info">
      <span class="count-badge" id="videoCountBadge">Ready</span>
      <span class="video-title-text" id="currentVideoTitle">Paste any YouTube video or playlist link to start</span>
    </div>
    <div class="view-mode-buttons">
      <button type="button" id="copyResumeBtn" onclick="copyResumeLink()" disabled title="Copy bookmark link for current video and timestamp">Copy Link</button>
      <button type="button" id="theaterBtn" onclick="toggleTheaterMode()">Theater Mode</button>
      <button type="button" onclick="setFocusMode(true)">Focus Mode</button>
      <button type="button" id="fullscreenBtn" onclick="toggleNativeFullscreen()">Fullscreen</button>
    </div>
  </div>

  <!-- Playlist Navigator -->
  <section class="playlist-panel" id="playlistPanel">
    <div class="playlist-controls">
      <div class="playlist-nav-group">
        <button type="button" id="prevPlaylistBtn" onclick="stepPlaylist(-1)" disabled>◀ Prev</button>
        <span class="playlist-label">Video #</span>
        <input type="number" id="playlistIndexInput" class="jump-input" min="1" value="1" inputmode="numeric" />
        <button type="button" class="primary" onclick="jumpToPlaylistIndex()">Go</button>
        <button type="button" id="nextPlaylistBtn" onclick="stepPlaylist(1)" disabled>Next ▶</button>
      </div>
      <div class="playlist-meta-group">
        <span class="playlist-total-hint" id="playlistTotalHint">Total videos: —</span>
        <button type="button" id="togglePlaylistTrayBtn" onclick="togglePlaylistTray()" disabled>Show Videos</button>
      </div>
    </div>
    <div class="playlist-tray" id="playlistTray" hidden></div>
  </section>

  <footer class="privacy-footer">100% Client-Side · No Cookies · No Device Storage · No Tracking</footer>

  <!-- Official YouTube IFrame Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    /* ------------------------------------------------------------------
       DOM references
    ------------------------------------------------------------------ */
    const ytInput = document.getElementById('ytInput');
    const statusMsg = document.getElementById('statusMsg');
    const playerWrapper = document.getElementById('playerWrapper');
    const playlistPanel = document.getElementById('playlistPanel');
    const playlistIndexInput = document.getElementById('playlistIndexInput');
    const prevPlaylistBtn = document.getElementById('prevPlaylistBtn');
    const nextPlaylistBtn = document.getElementById('nextPlaylistBtn');
    const videoCountBadge = document.getElementById('videoCountBadge');
    const currentVideoTitle = document.getElementById('currentVideoTitle');
    const focusTitleText = document.getElementById('focusTitleText');
    const playlistTotalHint = document.getElementById('playlistTotalHint');
    const togglePlaylistTrayBtn = document.getElementById('togglePlaylistTrayBtn');
    const playlistTray = document.getElementById('playlistTray');
    const clearBtn = document.getElementById('clearBtn');
    const copyResumeBtn = document.getElementById('copyResumeBtn');
    const theaterBtn = document.getElementById('theaterBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    /* ------------------------------------------------------------------
       State (In-Memory Only — Zero Device Storage)
    ------------------------------------------------------------------ */
    let ytPlayer = null;
    let isApiReady = false;
    let isPlayerReady = false;
    let pendingLoad = null;
    let pendingTargetVideoId = null;
    let pendingTargetStartSeconds = 0;
    let playlistPollTimer = null;
    let autoplayCheckTimer = null;
    let apiTimeout = null;
    let lastSyncedUrlKey = '';
    let hasFocusHistoryEntry = false;
    let lastAppliedUrlParams = {};
    let pendingUrlParamsAfterPop = null;
    let currentStatusKind = 'none';
    let currentSingleVideoId = null;
    let isPlaylistTrayOpen = false;
    let renderedPlaylistKey = '';
    let activePlaylistVideos = [];
    const sessionVideoMeta = new Map();

    const isHttpOrigin = /^https?:$/.test(window.location.protocol);

    let activePlaylist = {
      listId: null,
      currentIndex: 1,
      totalVideos: 0
    };

    function showStatus(msg, isInfo = false, kind = '') {
      statusMsg.textContent = msg || '';
      statusMsg.classList.toggle('info', isInfo);
      currentStatusKind = msg ? (kind || (isInfo ? 'info' : 'error')) : 'none';
    }

    /* ------------------------------------------------------------------
       YouTube IFrame API bootstrap
    ------------------------------------------------------------------ */
    function onYouTubeIframeAPIReady() {
      if (isApiReady) return;
      isApiReady = true;
      clearTimeout(apiTimeout);
      if (pendingLoad) ensurePlayer();
    }
    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

    function ensurePlayerMount() {
      if (!document.getElementById('ytPlayerMount')) {
        const mount = document.createElement('div');
        mount.id = 'ytPlayerMount';
        playerWrapper.innerHTML = '';
        playerWrapper.appendChild(mount);
      }
    }

    function ensurePlayer() {
      if (ytPlayer) return;
      ensurePlayerMount();

      const playerVars = {
        autoplay: 1,
        rel: 0,
        playsinline: 1,
        fs: 1
      };

      if (isHttpOrigin && window.location.origin) {
        playerVars.origin = window.location.origin;
      }

      ytPlayer = new YT.Player('ytPlayerMount', {
        host: 'https://www.youtube.com',
        playerVars,
        events: {
          onReady: () => {
            isPlayerReady = true;
            try {
              const iframe = typeof ytPlayer.getIframe === 'function' ? ytPlayer.getIframe() : null;
              if (iframe) iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
            } catch { /* ignore */ }

            const toLoad = pendingLoad;
            pendingLoad = null;
            if (toLoad) doLoad(toLoad);
          },
          onStateChange: (event) => {
            const PS = window.YT && window.YT.PlayerState;
            if (!PS) return;

            if (event.data === PS.PLAYING || event.data === PS.BUFFERING) {
              clearTimeout(autoplayCheckTimer);
            }

            if (event.data === PS.PLAYING && (currentStatusKind === 'autoplay' || currentStatusKind === 'loading')) {
              showStatus('');
            }

            if (
              event.data === PS.PLAYING ||
              event.data === PS.BUFFERING ||
              event.data === PS.CUED
            ) {
              syncPlayerMetadata();
            }
          },
          onAutoplayBlocked: () => {
            clearTimeout(autoplayCheckTimer);
            showStatus('Autoplay was blocked by your browser — tap or click the video to play.', true, 'autoplay');
          },
          onError: (event) => {
            clearTimeout(autoplayCheckTimer);
            const messages = {
              2: 'Invalid video link or ID, or the playlist could not be loaded.',
              5: 'HTML5 player error — please refresh the page.',
              100: 'Video not found (it may be private or deleted).',
              101: 'Embedding has been disabled by the video owner.',
              150: 'Embedding has been disabled by the video owner.',
              153: 'Error 153: Embed referrer blocked — open this page over http:// or https:// (not file://) and check ad blockers.'
            };
            showStatus(messages[event.data] || 'This video cannot be embedded or the link is invalid.');
          }
        }
      });
    }

    /* ------------------------------------------------------------------
       Metadata & Playlist Sync
    ------------------------------------------------------------------ */
    function formatDuration(totalSeconds) {
      const sec = Math.floor(Number(totalSeconds) || 0);
      if (sec <= 0) return '';
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const pad = (n) => String(n).padStart(2, '0');
      return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
    }

    function updateCopyResumeButton() {
      copyResumeBtn.disabled = !(activePlaylist.listId || currentSingleVideoId);
    }

    function updatePlaylistTrayButton() {
      const count = activePlaylistVideos.length;
      togglePlaylistTrayBtn.disabled = !activePlaylist.listId || count === 0;
      togglePlaylistTrayBtn.classList.toggle('active-toggle', isPlaylistTrayOpen && count > 0);
      if (count > 0) {
        togglePlaylistTrayBtn.textContent = isPlaylistTrayOpen ? `Hide Videos (${count})` : `Show Videos (${count})`;
      } else {
        togglePlaylistTrayBtn.textContent = 'Show Videos';
      }
    }

    function scrollActivePlaylistItemIntoView() {
      if (!isPlaylistTrayOpen || playlistTray.hidden) return;
      const activeCard = playlistTray.querySelector('.playlist-item.is-active');
      if (!activeCard) return;
      const targetTop = Math.max(0, activeCard.offsetTop - 12);
      playlistTray.scrollTo({ top: targetTop, behavior: 'smooth' });
    }

    function renderPlaylistTray(plArray) {
      const key = `${activePlaylist.listId}:${plArray.length}:${plArray[0] || ''}:${plArray[plArray.length - 1] || ''}`;
      if (key === renderedPlaylistKey) {
        syncPlaylistTrayCards();
        return;
      }

      renderedPlaylistKey = key;
      activePlaylistVideos = plArray.slice();
      playlistTray.innerHTML = '';

      const fragment = document.createDocumentFragment();
      activePlaylistVideos.forEach((videoId, zeroIdx) => {
        const oneBased = zeroIdx + 1;
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'playlist-item';
        card.dataset.index = String(oneBased);
        card.dataset.videoId = videoId;
        card.addEventListener('click', () => playPlaylistAt(oneBased));

        const thumbWrap = document.createElement('div');
        thumbWrap.className = 'playlist-thumb';

        const img = document.createElement('img');
        img.src = `https://i.ytimg.com/vi/${encodeURIComponent(videoId)}/mqdefault.jpg`;
        img.alt = `Video #${oneBased}`;
        img.loading = 'lazy';
        img.decoding = 'async';

        const numBadge = document.createElement('span');
        numBadge.className = 'playlist-num-badge';
        numBadge.textContent = `#${oneBased}`;

        const durBadge = document.createElement('span');
        durBadge.className = 'playlist-dur-badge';

        thumbWrap.appendChild(img);
        thumbWrap.appendChild(numBadge);
        thumbWrap.appendChild(durBadge);

        const meta = document.createElement('div');
        meta.className = 'playlist-item-meta';

        const titleEl = document.createElement('span');
        titleEl.className = 'playlist-item-title';
        titleEl.textContent = `Video #${oneBased}`;

        const stateEl = document.createElement('span');
        stateEl.className = 'playlist-item-state';

        meta.appendChild(titleEl);
        meta.appendChild(stateEl);

        card.appendChild(thumbWrap);
        card.appendChild(meta);
        fragment.appendChild(card);
      });

      playlistTray.appendChild(fragment);
      updatePlaylistTrayButton();
      syncPlaylistTrayCards(true);
    }

    function syncPlaylistTrayCards(shouldScroll = false) {
      if (!activePlaylistVideos.length) return;
      const cards = playlistTray.children;
      for (let i = 0; i < cards.length; i++) {
        const card = cards[i];
        const cardIndex = i + 1;
        const videoId = card.dataset.videoId;
        const meta = sessionVideoMeta.get(videoId);
        const isActive = cardIndex === activePlaylist.currentIndex;

        card.classList.toggle('is-active', isActive);
        card.setAttribute('aria-current', isActive ? 'true' : 'false');

        const titleEl = card.querySelector('.playlist-item-title');
        if (titleEl) {
          const label = meta && meta.title ? meta.title : `Video #${cardIndex}`;
          if (titleEl.textContent !== label) {
            titleEl.textContent = label;
            card.title = label;
          }
        }

        const durEl = card.querySelector('.playlist-dur-badge');
        if (durEl) {
          const durText = meta && meta.duration ? meta.duration : '';
          durEl.textContent = durText;
          durEl.classList.toggle('has-duration', Boolean(durText));
        }

        const stateEl = card.querySelector('.playlist-item-state');
        if (stateEl) {
          stateEl.textContent = isActive ? 'Playing' : (meta && meta.visited ? '✓' : '');
        }
      }

      if (shouldScroll) {
        scrollActivePlaylistItemIntoView();
      }
    }

    function togglePlaylistTray() {
      if (!activePlaylistVideos.length) return;
      isPlaylistTrayOpen = !isPlaylistTrayOpen;
      playlistTray.hidden = !isPlaylistTrayOpen;
      updatePlaylistTrayButton();
      if (isPlaylistTrayOpen) {
        syncPlaylistTrayCards(true);
      }
    }

    function resetPlaylistTray() {
      isPlaylistTrayOpen = false;
      renderedPlaylistKey = '';
      activePlaylistVideos = [];
      sessionVideoMeta.clear();
      playlistTray.innerHTML = '';
      playlistTray.hidden = true;
      updatePlaylistTrayButton();
    }

    function updatePlaylistControlsUI() {
      const idx = activePlaylist.currentIndex;
      const total = activePlaylist.totalVideos;
      prevPlaylistBtn.disabled = !activePlaylist.listId || idx <= 1;
      nextPlaylistBtn.disabled = !activePlaylist.listId || (total > 0 && total < 200 && idx >= total);
      updatePlaylistTrayButton();
      updateCopyResumeButton();
    }

    function syncPlayerMetadata() {
      if (!ytPlayer) return false;

      const data = typeof ytPlayer.getVideoData === 'function' ? ytPlayer.getVideoData() : null;
      const rawDuration = typeof ytPlayer.getDuration === 'function' ? ytPlayer.getDuration() : 0;
      const formattedDuration = formatDuration(rawDuration);

      if (data && data.title) {
        currentVideoTitle.textContent = data.title;
        currentVideoTitle.title = data.title;
        focusTitleText.textContent = data.title;
      }

      if (data && data.video_id) {
        const prevMeta = sessionVideoMeta.get(data.video_id) || {};
        sessionVideoMeta.set(data.video_id, {
          title: data.title || prevMeta.title || '',
          duration: formattedDuration || prevMeta.duration || '',
          visited: true
        });
      }

      if (activePlaylist.listId) {
        let listReady = false;
        let indexChanged = false;
        const plArray = typeof ytPlayer.getPlaylist === 'function' ? ytPlayer.getPlaylist() : null;

        if (Array.isArray(plArray) && plArray.length > 0) {
          listReady = true;

          // If user pasted ?v=VIDEO_ID&list=PLAYLIST_ID without &index=, jump once to that video
          if (pendingTargetVideoId) {
            const targetIdx = plArray.indexOf(pendingTargetVideoId);
            const targetStart = pendingTargetStartSeconds;
            pendingTargetVideoId = null;
            pendingTargetStartSeconds = 0;

            if (targetIdx > 0 && typeof ytPlayer.playVideoAt === 'function') {
              ytPlayer.playVideoAt(targetIdx);
              if (targetStart > 0 && typeof ytPlayer.seekTo === 'function') {
                setTimeout(() => {
                  try { ytPlayer.seekTo(targetStart, true); } catch { /* ignore */ }
                }, 400);
              }
              return true;
            } else if (targetIdx === 0 && targetStart > 0 && typeof ytPlayer.seekTo === 'function') {
              try { ytPlayer.seekTo(targetStart, true); } catch { /* ignore */ }
            } else if (targetIdx === -1 && plArray.length >= 200) {
              showStatus('This video is beyond item 200 — use the Video # box to jump directly to it.', true, 'note');
            }
          }

          activePlaylist.totalVideos = plArray.length;
          playlistTotalHint.textContent =
            plArray.length >= 200
              ? `Loaded videos: ${plArray.length}+`
              : `Total videos in playlist: ${plArray.length}`;

          renderPlaylistTray(plArray);
        }

        if (typeof ytPlayer.getPlaylistIndex === 'function') {
          const plIdx = ytPlayer.getPlaylistIndex();
          if (typeof plIdx === 'number' && plIdx >= 0) {
            const nextIndex = plIdx + 1;
            indexChanged = nextIndex !== activePlaylist.currentIndex;
            activePlaylist.currentIndex = nextIndex;
            playlistIndexInput.value = activePlaylist.currentIndex;

            const totalText = activePlaylist.totalVideos > 0 ? activePlaylist.totalVideos : '?';
            videoCountBadge.textContent = `Video ${activePlaylist.currentIndex} / ${totalText}`;

            const syncKey = `${activePlaylist.listId}:${activePlaylist.currentIndex}`;
            if (syncKey !== lastSyncedUrlKey) {
              lastSyncedUrlKey = syncKey;
              updateURLParams({ list: activePlaylist.listId, index: activePlaylist.currentIndex });
            }
          }
        }

        syncPlaylistTrayCards(indexChanged);
        updatePlaylistControlsUI();
        return listReady;
      }

      if (data && data.video_id) {
        currentSingleVideoId = data.video_id;
        videoCountBadge.textContent = 'Single Video';
        updateCopyResumeButton();
      }
      return true;
    }

    function startPlaylistPolling() {
      stopPlaylistPolling();
      let tries = 0;
      playlistPollTimer = setInterval(() => {
        tries++;
        if (!ytPlayer || !activePlaylist.listId) {
          stopPlaylistPolling();
          return;
        }
        const gotList = syncPlayerMetadata();
        if (gotList || tries >= 25) {
          stopPlaylistPolling();
        }
      }, 400);
    }

    function stopPlaylistPolling() {
      if (playlistPollTimer) {
        clearInterval(playlistPollTimer);
        playlistPollTimer = null;
      }
    }

    function scheduleAutoplayCheck() {
      clearTimeout(autoplayCheckTimer);
      autoplayCheckTimer = setTimeout(() => {
        const PS = window.YT && window.YT.PlayerState;
        if (!PS || !ytPlayer || typeof ytPlayer.getPlayerState !== 'function') return;
        const state = ytPlayer.getPlayerState();
        if (state === PS.UNSTARTED || state === PS.CUED) {
          showStatus('Autoplay was blocked — tap or click the video to start playback.', true, 'autoplay');
        }
      }, 3000);
    }

    /* ------------------------------------------------------------------
       URL & Timestamp Parsing
    ------------------------------------------------------------------ */
    function parseTimestamp(raw) {
      if (!raw) return 0;
      const val = String(raw).trim().toLowerCase();
      if (/^\d+$/.test(val)) return parseInt(val, 10);

      const match = val.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/);
      if (!match) return 0;
      const h = parseInt(match[1] || '0', 10);
      const m = parseInt(match[2] || '0', 10);
      const s = parseInt(match[3] || '0', 10);
      return h * 3600 + m * 60 + s;
    }

    function isNonEmbeddableList(listId) {
      return /^(RD|WL|LL|LM)/i.test(listId);
    }

    function parseYouTubeURL(rawUrl) {
      let input = String(rawUrl || '').trim();
      if (!input) return null;

      if (/^[a-zA-Z0-9_-]{11}$/.test(input)) {
        return { videoId: input, listId: null, index: 1, hasExplicitIndex: false, startSeconds: 0, note: '' };
      }

      if (/^(PL|UU|OLAK5uy_)[a-zA-Z0-9_-]{10,}$/.test(input)) {
        return { videoId: null, listId: input, index: 1, hasExplicitIndex: false, startSeconds: 0, note: '' };
      }

      // Extract URL if user pasted shared text containing a YouTube link (e.g. WhatsApp/YouTube share)
      const embeddedUrlMatch = input.match(/https?:\/\/[^\s<>"{}|\\^`[\]]+/i);
      if (embeddedUrlMatch) {
        input = embeddedUrlMatch[0];
      } else if (!/^https?:\/\//i.test(input)) {
        input = 'https://' + input;
      }

      try {
        const urlObj = new URL(input);
        const host = urlObj.hostname.replace(/^www\./, '').toLowerCase();
        const isYouTube =
          host === 'youtube.com' || host.endsWith('.youtube.com') ||
          host === 'youtube-nocookie.com' || host.endsWith('.youtube-nocookie.com');

        if (host !== 'youtu.be' && !isYouTube) return null;

        let videoId = null;
        let listId = urlObj.searchParams.get('list');
        const rawIndexParam = urlObj.searchParams.get('index');
        const parsedIndex = parseInt(rawIndexParam, 10);
        const hasExplicitIndex = !isNaN(parsedIndex) && parsedIndex >= 1;
        const index = hasExplicitIndex ? parsedIndex : 1;

        const rawTime =
          urlObj.searchParams.get('t') ||
          urlObj.searchParams.get('start') ||
          (urlObj.hash ? urlObj.hash.replace(/^#t=/i, '') : '');
        const startSeconds = parseTimestamp(rawTime);

        if (host === 'youtu.be') {
          videoId = urlObj.pathname.slice(1).split('/')[0];
        } else if (urlObj.pathname === '/watch' || urlObj.pathname === '/watch/') {
          videoId = urlObj.searchParams.get('v');
        } else if (
          urlObj.pathname.startsWith('/embed/') ||
          urlObj.pathname.startsWith('/shorts/') ||
          urlObj.pathname.startsWith('/live/') ||
          urlObj.pathname.startsWith('/v/')
        ) {
          videoId = urlObj.pathname.split('/')[2];
        }

        if (videoId && !/^[a-zA-Z0-9_-]{11}$/.test(videoId)) {
          videoId = null;
        }

        let note = '';
        if (listId && isNonEmbeddableList(listId)) {
          if (videoId) {
            listId = null;
            note = 'Mix and personal playlists cannot be embedded — playing the single video instead.';
          } else {
            return { error: 'Mix, Watch Later, and Liked playlists are not available for embedding.' };
          }
        }

        if (!videoId && !listId) return null;

        return { videoId, listId, index, hasExplicitIndex, startSeconds, note };
      } catch {
        return null;
      }
    }

    function updateURLParams(paramsMap) {
      lastAppliedUrlParams = { ...(paramsMap || {}) };
      if (!isHttpOrigin) return;
      try {
        const pageUrl = new URL(window.location.href);
        pageUrl.search = '';
        Object.entries(lastAppliedUrlParams).forEach(([key, val]) => {
          if (val !== null && val !== undefined && val !== '') {
            pageUrl.searchParams.set(key, String(val));
          }
        });
        window.history.replaceState(window.history.state, '', pageUrl);
      } catch {
        // ignore if restricted
      }
    }

    /* ------------------------------------------------------------------
       Media Loading
    ------------------------------------------------------------------ */
    function syncIdleStateUI() {
      const hasMedia = document.body.classList.contains('has-media');
      clearBtn.hidden = !hasMedia && !ytInput.value.trim();
    }

    function loadMedia(parsed) {
      document.body.classList.add('has-media');
      syncIdleStateUI();
      showStatus(parsed.note || '', Boolean(parsed.note), parsed.note ? 'note' : 'none');

      if (!isApiReady) {
        pendingLoad = parsed;
        if (!parsed.note) showStatus('Loading player...', true, 'loading');
        return;
      }

      ensurePlayer();

      if (isPlayerReady) {
        doLoad(parsed);
      } else {
        pendingLoad = parsed;
        if (!parsed.note) showStatus('Loading player...', true, 'loading');
      }
    }

    function doLoad(parsed) {
      stopPlaylistPolling();
      lastSyncedUrlKey = '';
      pendingTargetVideoId = null;
      pendingTargetStartSeconds = 0;

      showStatus(parsed.note || '', Boolean(parsed.note), parsed.note ? 'note' : 'none');
      document.body.classList.toggle('has-playlist', Boolean(parsed.listId));

      if (parsed.listId) {
        if (activePlaylist.listId !== parsed.listId) {
          resetPlaylistTray();
        }
        currentSingleVideoId = null;
        activePlaylist = {
          listId: parsed.listId,
          currentIndex: parsed.index || 1,
          totalVideos: 0
        };

        const needsTargetLookup = Boolean(parsed.videoId && !parsed.hasExplicitIndex);
        if (needsTargetLookup) {
          pendingTargetVideoId = parsed.videoId;
          pendingTargetStartSeconds = parsed.startSeconds || 0;
        }

        playlistIndexInput.value = activePlaylist.currentIndex;
        playlistTotalHint.textContent = 'Loading playlist count...';
        videoCountBadge.textContent = `Video ${activePlaylist.currentIndex} / ...`;
        currentVideoTitle.textContent = 'Loading playlist...';
        currentVideoTitle.removeAttribute('title');
        focusTitleText.textContent = 'Loading playlist...';
        playlistPanel.style.display = 'block';
        updatePlaylistControlsUI();

        ytPlayer.loadPlaylist({
          list: parsed.listId,
          listType: 'playlist',
          index: (parsed.index || 1) - 1,
          startSeconds: needsTargetLookup ? 0 : (parsed.startSeconds || 0)
        });

        updateURLParams({ list: parsed.listId, index: activePlaylist.currentIndex });
        startPlaylistPolling();
      } else {
        resetPlaylistTray();
        currentSingleVideoId = parsed.videoId;
        activePlaylist = { listId: null, currentIndex: 1, totalVideos: 0 };
        playlistPanel.style.display = 'none';
        videoCountBadge.textContent = 'Single Video';
        currentVideoTitle.textContent = 'Loading video...';
        currentVideoTitle.removeAttribute('title');
        focusTitleText.textContent = 'Loading video...';
        updatePlaylistControlsUI();

        ytPlayer.loadVideoById({
          videoId: parsed.videoId,
          startSeconds: parsed.startSeconds || 0
        });

        const params = { v: parsed.videoId };
        if (parsed.startSeconds > 0) params.t = parsed.startSeconds;
        updateURLParams(params);
      }

      scheduleAutoplayCheck();
    }

    /* ------------------------------------------------------------------
       Playlist Navigation
    ------------------------------------------------------------------ */
    function playPlaylistAt(oneBasedIndex) {
      if (!activePlaylist.listId || !ytPlayer || !isPlayerReady) return;

      let safeIndex = Math.max(1, parseInt(oneBasedIndex, 10) || 1);
      if (activePlaylist.totalVideos > 0 && activePlaylist.totalVideos < 200 && safeIndex > activePlaylist.totalVideos) {
        safeIndex = activePlaylist.totalVideos;
      }

      pendingTargetVideoId = null;
      activePlaylist.currentIndex = safeIndex;
      playlistIndexInput.value = safeIndex;
      updatePlaylistControlsUI();
      syncPlaylistTrayCards(true);

      const loadedList = typeof ytPlayer.getPlaylist === 'function' ? ytPlayer.getPlaylist() : null;
      if (typeof ytPlayer.playVideoAt === 'function' && Array.isArray(loadedList) && safeIndex <= loadedList.length) {
        ytPlayer.playVideoAt(safeIndex - 1);
      } else {
        ytPlayer.loadPlaylist({
          list: activePlaylist.listId,
          listType: 'playlist',
          index: safeIndex - 1
        });
        startPlaylistPolling();
      }
    }

    function jumpToPlaylistIndex() {
      playPlaylistAt(playlistIndexInput.value);
    }

    function stepPlaylist(delta) {
      const target = activePlaylist.currentIndex + delta;
      if (target < 1) return;
      if (activePlaylist.totalVideos > 0 && activePlaylist.totalVideos < 200 && target > activePlaylist.totalVideos) return;
      playPlaylistAt(target);
    }

    /* ------------------------------------------------------------------
       User Actions
    ------------------------------------------------------------------ */
    function handlePlay() {
      const parsed = parseYouTubeURL(ytInput.value);
      if (!parsed) {
        showStatus('Please paste a valid YouTube video or playlist link.');
        return;
      }
      if (parsed.error) {
        showStatus(parsed.error);
        return;
      }
      loadMedia(parsed);
    }

    async function pasteAndPlay() {
      try {
        if (!navigator.clipboard || typeof navigator.clipboard.readText !== 'function') {
          throw new Error('clipboard-unavailable');
        }
        const text = await navigator.clipboard.readText();
        if (!text || !text.trim()) {
          showStatus('Clipboard is empty.', true);
          return;
        }
        ytInput.value = text.trim();
        syncIdleStateUI();
        handlePlay();
      } catch (err) {
        const denied = err && err.name === 'NotAllowedError';
        showStatus(
          denied
            ? 'Clipboard permission denied — paste directly into the box to auto-play.'
            : 'Auto-paste is unavailable here — paste directly into the box to auto-play.',
          true
        );
        ytInput.focus();
        ytInput.select();
      }
    }

    ytInput.addEventListener('paste', (e) => {
      const pastedText = (e.clipboardData || window.clipboardData)?.getData('text');
      if (pastedText && pastedText.trim()) {
        e.preventDefault();
        ytInput.value = pastedText.trim();
        syncIdleStateUI();
        handlePlay();
      }
    });

    ytInput.addEventListener('input', () => {
      if (!ytInput.value.trim()) {
        if (document.body.classList.contains('has-media')) {
          clearPlayer({ keepFocus: true });
        } else {
          showStatus('');
          syncIdleStateUI();
        }
        return;
      }
      syncIdleStateUI();
    });

    async function copyResumeLink() {
      if (!activePlaylist.listId && !currentSingleVideoId) return;

      const currentSec =
        ytPlayer && typeof ytPlayer.getCurrentTime === 'function'
          ? Math.floor(ytPlayer.getCurrentTime() || 0)
          : 0;

      const params = {};
      if (activePlaylist.listId) {
        params.list = activePlaylist.listId;
        params.index = activePlaylist.currentIndex;
      } else if (currentSingleVideoId) {
        params.v = currentSingleVideoId;
      }
      if (currentSec > 0) {
        params.t = currentSec;
      }

      let shareUrl = '';
      try {
        const urlObj = new URL(window.location.href);
        urlObj.search = '';
        urlObj.hash = '';
        Object.entries(params).forEach(([key, val]) => {
          urlObj.searchParams.set(key, String(val));
        });
        shareUrl = urlObj.toString();
      } catch {
        showStatus('Could not generate a resume link.', false);
        return;
      }

      const timeLabel = formatDuration(currentSec);
      const successMsg = timeLabel
        ? `Resume link copied (${timeLabel}) — ready to bookmark.`
        : 'Resume link copied — ready to bookmark.';

      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          await navigator.clipboard.writeText(shareUrl);
          showStatus(successMsg, true, 'note');
          return;
        }
        throw new Error('clipboard-unavailable');
      } catch {
        try {
          const tempInput = document.createElement('textarea');
          tempInput.value = shareUrl;
          tempInput.setAttribute('readonly', '');
          tempInput.style.position = 'fixed';
          tempInput.style.opacity = '0';
          document.body.appendChild(tempInput);
          tempInput.select();
          const copied = document.execCommand('copy');
          document.body.removeChild(tempInput);
          if (copied) {
            showStatus(successMsg, true, 'note');
            return;
          }
        } catch { /* ignore */ }

        updateURLParams(params);
        showStatus('Address bar updated — copy or bookmark the link from your browser.', true, 'note');
      }
    }

    function clearPlayer(options = {}) {
      ytInput.value = '';
      showStatus('');
      stopPlaylistPolling();
      clearTimeout(autoplayCheckTimer);
      pendingLoad = null;
      pendingTargetVideoId = null;
      pendingTargetStartSeconds = 0;
      lastSyncedUrlKey = '';
      currentSingleVideoId = null;

      const wasInFocus = document.body.classList.contains('focus-mode');
      if (wasInFocus) {
        setFocusMode(false, {});
      }

      if (document.body.classList.contains('theater-mode')) {
        document.body.classList.remove('theater-mode');
        theaterBtn.classList.remove('active-toggle');
        theaterBtn.textContent = 'Theater Mode';
      }

      document.body.classList.remove('has-media', 'has-playlist');

      try {
        if (ytPlayer && typeof ytPlayer.destroy === 'function') {
          ytPlayer.destroy();
        }
      } catch { /* ignore */ }

      ytPlayer = null;
      isPlayerReady = false;
      ensurePlayerMount();

      resetPlaylistTray();
      activePlaylist = { listId: null, currentIndex: 1, totalVideos: 0 };
      playlistPanel.style.display = 'none';
      playlistIndexInput.value = 1;
      playlistTotalHint.textContent = 'Total videos: —';
      videoCountBadge.textContent = 'Ready';
      currentVideoTitle.textContent = 'Paste any YouTube video or playlist link to start';
      currentVideoTitle.removeAttribute('title');
      focusTitleText.textContent = 'Focus Mode';
      updatePlaylistControlsUI();
      syncIdleStateUI();
      if (!wasInFocus) {
        updateURLParams({});
      } else {
        lastAppliedUrlParams = {};
      }
      if (options.keepFocus) {
        ytInput.focus();
      }
    }

    /* ------------------------------------------------------------------
       View Modes (Theater, Focus with Android Back Support, Fullscreen)
    ------------------------------------------------------------------ */
    function toggleTheaterMode() {
      if (document.body.classList.contains('focus-mode')) {
        setFocusMode(false);
      }
      const isTheater = document.body.classList.toggle('theater-mode');
      theaterBtn.classList.toggle('active-toggle', isTheater);
      theaterBtn.textContent = isTheater ? 'Default View' : 'Theater Mode';
    }

    function applyFocusModeUI(enable) {
      document.body.classList.toggle('focus-mode', enable);
    }

    function setFocusMode(enable, overrideParamsAfterPop = null) {
      const shouldEnable = !!enable;
      const isCurrentlyFocus = document.body.classList.contains('focus-mode');
      if (shouldEnable === isCurrentlyFocus) return;

      if (shouldEnable) {
        applyFocusModeUI(true);
        if (isHttpOrigin) {
          try {
            window.history.pushState({ focusTubeMode: true }, '');
            hasFocusHistoryEntry = true;
          } catch {
            hasFocusHistoryEntry = false;
          }
        }
      } else {
        applyFocusModeUI(false);
        if (hasFocusHistoryEntry && isHttpOrigin) {
          hasFocusHistoryEntry = false;
          try {
            if (window.history.state && window.history.state.focusTubeMode) {
              pendingUrlParamsAfterPop = overrideParamsAfterPop !== null
                ? { ...overrideParamsAfterPop }
                : { ...lastAppliedUrlParams };
              window.history.back();
            } else if (overrideParamsAfterPop !== null) {
              updateURLParams(overrideParamsAfterPop);
            }
          } catch { /* ignore */ }
        } else if (overrideParamsAfterPop !== null) {
          updateURLParams(overrideParamsAfterPop);
        }
      }
    }

    window.addEventListener('popstate', () => {
      if (document.body.classList.contains('focus-mode')) {
        hasFocusHistoryEntry = false;
        applyFocusModeUI(false);
        // Keep URL synced with whatever video/playlist index is currently playing
        updateURLParams(lastAppliedUrlParams);
      } else if (pendingUrlParamsAfterPop !== null) {
        const paramsToRestore = pendingUrlParamsAfterPop;
        pendingUrlParamsAfterPop = null;
        updateURLParams(paramsToRestore);
      }
    });

    const supportsNativeFullscreen = Boolean(
      playerWrapper.requestFullscreen || playerWrapper.webkitRequestFullscreen
    );
    if (!supportsNativeFullscreen) {
      fullscreenBtn.hidden = true;
    }

    async function toggleNativeFullscreen() {
      const fsElement = document.fullscreenElement || document.webkitFullscreenElement;
      if (fsElement) {
        try {
          if (document.exitFullscreen) await document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        } catch { /* ignore */ }
        return;
      }

      try {
        if (playerWrapper.requestFullscreen) {
          await playerWrapper.requestFullscreen();
        } else if (playerWrapper.webkitRequestFullscreen) {
          playerWrapper.webkitRequestFullscreen();
        } else {
          showStatus('Use the fullscreen icon inside the video player in this browser.', true);
        }
      } catch {
        showStatus('Could not enter fullscreen — tap the fullscreen icon inside the video player.', true);
      }
    }

    function syncFullscreenBtnLabel() {
      const active = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      fullscreenBtn.textContent = active ? 'Exit Fullscreen' : 'Fullscreen';
      fullscreenBtn.classList.toggle('active-toggle', active);
    }

    document.addEventListener('fullscreenchange', syncFullscreenBtnLabel);
    document.addEventListener('webkitfullscreenchange', syncFullscreenBtnLabel);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.body.classList.contains('focus-mode')) {
        setFocusMode(false);
      }
    });

    ytInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handlePlay();
      }
    });

    playlistIndexInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        jumpToPlaylistIndex();
      }
    });

    /* ------------------------------------------------------------------
       Boot: Protocol Check & URL State Restore
    ------------------------------------------------------------------ */
    function initFromURL() {
      if (!isHttpOrigin) {
        showStatus('Tip: Opening via file:// may cause YouTube Error 153 — open over http:// or https:// instead.', true);
      }

      const params = new URLSearchParams(window.location.search);
      const v = params.get('v');
      const list = params.get('list');
      const index = params.get('index');
      const t = params.get('t') || params.get('start');

      if (!v && !list) return;

      const targetUrl = v
        ? new URL('https://www.youtube.com/watch')
        : new URL('https://www.youtube.com/playlist');

      if (v) targetUrl.searchParams.set('v', v);
      if (list) targetUrl.searchParams.set('list', list);
      if (index) targetUrl.searchParams.set('index', index);
      if (t) targetUrl.searchParams.set('t', t);

      ytInput.value = targetUrl.toString();
      const parsed = parseYouTubeURL(ytInput.value);
      if (parsed && !parsed.error) loadMedia(parsed);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initFromURL);
    } else {
      initFromURL();
    }

    if (window.YT && window.YT.Player) {
      onYouTubeIframeAPIReady();
    }

    apiTimeout = setTimeout(() => {
      if (!isApiReady) {
        showStatus('YouTube player failed to load. Check your internet connection or ad blocker, and open over http:// or https://.', true);
      }
    }, 8000);
  </script>
</body>
</html>
